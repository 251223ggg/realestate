<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>부동산 입지 분석 & 실거래가 조회</title>
  
  <!-- Pretendard 웹 폰트 -->
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />

  <!-- 카카오맵 JavaScript SDK -->
  <script type="text/javascript" src="//dapi.kakao.com/v2/maps/sdk.js?appkey=5845b1683e12f110576582b0adefc345&libraries=services&autoload=false"></script>

  <style>
    :root {
      --primary: #3182f6;
      --primary-dark: #1b64da;
      --primary-soft: #e8f3ff;
      --han-river: #0284c7;
      --han-river-soft: #e0f2fe;
      --price-tag: #059669;
      --price-bg: #ecfdf5;
      --text-main: #191f28;
      --text-sub: #4e5968;
      --text-muted: #8b95a1;
      --bg-surface: #ffffff;
      --bg-sub: #f9fafb;
      --border-color: #e5e7eb;
      --radius-lg: 20px;
      --radius-md: 12px;
      --shadow-card: 0 12px 32px rgba(0, 0, 0, 0.08);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Pretendard', sans-serif; }
    body, html { width: 100%; height: 100%; overflow: hidden; background-color: #f2f4f6; }

    .app-container { position: relative; width: 100vw; height: 100vh; display: flex; }
    .map-wrapper { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
    #map { width: 100%; height: 100%; }

    /* 플로팅 사이드바 */
    .floating-sidebar {
      position: absolute; top: 20px; left: 20px; width: 420px;
      height: calc(100vh - 40px); background: #ffffff;
      border-radius: var(--radius-lg); box-shadow: var(--shadow-card);
      z-index: 10; display: flex; flex-direction: column; overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.8);
    }

    .sidebar-header { padding: 20px 20px 14px; background: #ffffff; }
    .brand-tag { font-size: 11px; font-weight: 800; color: var(--primary); letter-spacing: 1px; display: block; margin-bottom: 4px; }
    .sidebar-header h1 { font-size: 20px; font-weight: 800; color: var(--text-main); }

    /* 검색바 */
    .search-box-wrapper { padding: 0 20px 14px; background: #ffffff; }
    .search-input-group {
      display: flex; align-items: center; background-color: var(--bg-sub);
      border: 1.5px solid var(--border-color); border-radius: var(--radius-md); padding: 4px 6px 4px 14px;
    }
    .search-input-group:focus-within { background-color: #ffffff; border-color: var(--primary); }
    .search-input-group input { flex: 1; border: none; background: transparent; font-size: 14px; font-weight: 600; outline: none; padding: 6px 0; }
    .search-input-group button { background: var(--primary); color: #fff; border: none; border-radius: 8px; padding: 8px 14px; font-size: 13px; font-weight: 700; cursor: pointer; }

    /* 📌 3분할 탭 메뉴 (강조) */
    .tab-menu { 
      display: flex; 
      width: 100%;
      border-top: 1px solid var(--border-color);
      border-bottom: 2px solid var(--border-color); 
      background: #ffffff; 
    }
    .tab-btn {
      flex: 1; 
      padding: 14px 0; 
      font-size: 13.5px; 
      font-weight: 800; 
      color: var(--text-muted);
      background: #ffffff; 
      border: none; 
      border-bottom: 3px solid transparent; 
      cursor: pointer; 
      text-align: center;
      transition: all 0.2s;
      white-space: nowrap;
    }
    .tab-btn:hover { color: var(--primary); background: #f8fafc; }
    .tab-btn.active { 
      color: var(--primary); 
      border-bottom-color: var(--primary); 
      background: #eff6ff; 
    }

    /* 탭 콘텐츠 영역 */
    .tab-content { flex: 1; overflow-y: auto; padding: 16px; background-color: #fafbfc; }

    /* 📊 탭 1: 입지 리포트 카드 */
    .score-summary-card { background: #ffffff; border-radius: var(--radius-md); padding: 18px; border: 1px solid var(--border-color); margin-bottom: 14px; }
    .location-name { font-size: 13px; color: var(--text-sub); font-weight: 600; margin-bottom: 6px; }
    .score-main-row { display: flex; align-items: baseline; justify-content: space-between; }
    .score-number { font-size: 36px; font-weight: 900; color: var(--text-main); }
    .score-number span { font-size: 16px; color: var(--text-muted); }
    .grade-badge { font-size: 14px; font-weight: 800; padding: 6px 14px; border-radius: 20px; color: #ffffff; }
    .grade-S-plus { background: linear-gradient(135deg, #2563eb, #1d4ed8); }
    .grade-S { background: linear-gradient(135deg, #059669, #10b981); }
    .grade-A { background: linear-gradient(135deg, #d97706, #f59e0b); }
    .grade-B { background: linear-gradient(135deg, #4b5563, #6b7280); }
    .grade-C { background: linear-gradient(135deg, #dc2626, #ef4444); }

    .han-river-badge {
      display: none; align-items: center; gap: 6px; background: var(--han-river-soft);
      color: var(--han-river); font-size: 12px; font-weight: 800; padding: 8px 12px;
      border-radius: 8px; margin-top: 10px; border: 1px solid rgba(2, 132, 199, 0.2);
    }

    .walk-metric-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 14px; }
    .metric-card { background: #ffffff; border: 1px solid var(--border-color); border-radius: var(--radius-md); padding: 12px; }
    .metric-card .label { font-size: 11px; font-weight: 700; color: var(--text-muted); margin-bottom: 4px; }
    .metric-card .val { font-size: 14px; font-weight: 800; color: var(--text-main); }
    .metric-card .sub { font-size: 11px; color: var(--primary); font-weight: 700; margin-top: 2px; }

    .category-breakdown { background: #ffffff; border-radius: var(--radius-md); padding: 16px; border: 1px solid var(--border-color); }
    .score-item { margin-bottom: 10px; }
    .score-item-header { display: flex; justify-content: space-between; font-size: 12px; font-weight: 700; color: var(--text-sub); margin-bottom: 4px; }
    .progress-bg { height: 8px; background: var(--bg-sub); border-radius: 4px; overflow: hidden; }
    .progress-fill { height: 100%; background: var(--primary); border-radius: 4px; transition: width 0.4s ease; }
    .progress-fill.river-fill { background: var(--han-river); }

    /* 💰 탭 2: 실거래가 카드 스타일 */
    .trade-card { background: #ffffff; padding: 14px 16px; border-radius: var(--radius-md); margin-bottom: 10px; border: 1px solid var(--border-color); }
    .trade-card .apt-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
    .trade-card .apt-name { font-size: 14.5px; font-weight: 800; color: var(--text-main); }
    .trade-card .price-tag { font-size: 13.5px; font-weight: 800; color: var(--price-tag); background: var(--price-bg); padding: 3px 8px; border-radius: 6px; }
    .trade-card .trade-details { display: flex; gap: 10px; font-size: 11.5px; color: var(--text-sub); font-weight: 600; }

    /* 📍 탭 3: 주변 시설 카드 */
    .place-card { background: #ffffff; padding: 12px 14px; border-radius: var(--radius-md); margin-bottom: 8px; border: 1px solid var(--border-color); cursor: pointer; }
    .place-card:hover { border-color: var(--primary); transform: translateY(-1px); }
    .place-card .badge { display: inline-block; font-size: 10px; font-weight: 700; color: var(--primary); background: var(--primary-soft); padding: 2px 6px; border-radius: 4px; margin-bottom: 4px; }
    .place-card .title { font-size: 14px; font-weight: 700; color: var(--text-main); margin-bottom: 2px; }
    .place-card .address { font-size: 11.5px; color: var(--text-sub); }

    .info-message-box { padding: 20px; text-align: center; font-size: 13px; color: var(--text-sub); line-height: 1.6; background: #ffffff; border-radius: var(--radius-md); border: 1px solid var(--border-color); }

    /* 레이어 토글 & 버튼 */
    .layer-toggle-panel { position: absolute; top: 20px; right: 20px; z-index: 10; background: #ffffff; padding: 8px 12px; border-radius: var(--radius-md); box-shadow: var(--shadow-card); display: flex; gap: 6px; }
    .layer-btn { padding: 6px 12px; font-size: 12px; font-weight: 700; border: 1px solid var(--border-color); background: var(--bg-sub); color: var(--text-sub); border-radius: 16px; cursor: pointer; }
    .layer-btn.active { background: var(--primary); color: #ffffff; border-color: var(--primary); }

    .my-location-fab { position: absolute; bottom: 24px; right: 20px; z-index: 10; background: #ffffff; color: var(--text-main); border: none; padding: 12px 18px; border-radius: 30px; font-size: 13.5px; font-weight: 700; box-shadow: var(--shadow-card); cursor: pointer; }

    .custom-overlay-card { position: relative; bottom: 45px; border-radius: 14px; background: #ffffff; padding: 14px 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.15); border: 1px solid var(--border-color); min-width: 200px; }
    .custom-overlay-card strong { display: block; font-size: 14px; font-weight: 800; color: var(--text-main); margin-bottom: 4px; }
    .custom-overlay-card .addr { font-size: 11.5px; color: var(--text-sub); margin-bottom: 6px; }
    .custom-overlay-card .link-btn { font-size: 11.5px; font-weight: 700; color: var(--primary); text-decoration: none; }
  </style>
</head>
<body>

  <div class="app-container">
    <div class="map-wrapper"><div id="map"></div></div>

    <div class="layer-toggle-panel">
      <button class="layer-btn active" onclick="toggleLayer('SW8', this)">🚆 지하철</button>
      <button class="layer-btn active" onclick="toggleLayer('SC4', this)">🏫 학교/학원</button>
      <button class="layer-btn active" onclick="toggleLayer('MT1', this)">🛒 마트/편의점</button>
      <button class="layer-btn active" onclick="toggleLayer('HP8', this)">🏥 병원</button>
    </div>

    <!-- 사이드바 -->
    <div class="floating-sidebar">
      <div class="sidebar-header">
        <span class="brand-tag">SEOUL REAL ESTATE ANALYTICS</span>
        <h1>입지 분석 리포트</h1>
      </div>

      <form class="search-box-wrapper" onsubmit="handleSearch(event)">
        <div class="search-input-group">
          <input type="text" id="keywordInput" placeholder="지역, 지하철역, 단지명 검색" value="여의도역">
          <button type="submit">검색</button>
        </div>
      </form>

      <!-- 📌 3분할 탭 버튼 목록 -->
      <div class="tab-menu">
        <button class="tab-btn active" id="tabReportBtn" onclick="switchTab('report')">📊 입지 리포트</button>
        <button class="tab-btn" id="tabPriceBtn" onclick="switchTab('price')">💰 실거래가</button>
        <button class="tab-btn" id="tabListBtn" onclick="switchTab('list')">📍 주변 시설</button>
      </div>

      <!-- 1. 📊 입지 리포트 탭 -->
      <div class="tab-content" id="reportTab">
        <div class="score-summary-card">
          <div class="location-name" id="currentAddressText">서울시 영등포구 여의도동 (분석중...)</div>
          <div class="score-main-row">
            <div class="score-number" id="totalScoreText">85<span>/100</span></div>
            <div class="grade-badge grade-S" id="gradeBadgeText">S 등급</div>
          </div>
          <div class="han-river-badge" id="hanRiverBadge">
            <span id="hanRiverBadgeText">🌊 한강뷰 (10점)</span>
          </div>
        </div>

        <div class="walk-metric-grid">
          <div class="metric-card">
            <div class="label">🚆 최단 지하철역</div>
            <div class="val" id="subwayNameText">-</div>
            <div class="sub" id="subwayWalkText">-m · 도보 -분</div>
          </div>
          <div class="metric-card">
            <div class="label">🏫 최단 초등학교</div>
            <div class="val" id="schoolNameText">-</div>
            <div class="sub" id="schoolWalkText">-m · 도보 -분</div>
          </div>
        </div>

        <div class="category-breakdown">
          <div class="score-item">
            <div class="score-item-header"><span>🚆 교통 입지 (30점)</span><span id="scoreTrafficText">25점</span></div>
            <div class="progress-bg"><div class="progress-fill" id="barTraffic" style="width: 83%;"></div></div>
          </div>
          <div class="score-item">
            <div class="score-item-header"><span>🏫 교육 입지 (30점)</span><span id="scoreEduText">24점</span></div>
            <div class="progress-bg"><div class="progress-fill" id="barEdu" style="width: 80%;"></div></div>
          </div>
          <div class="score-item">
            <div class="score-item-header"><span>🛒 편의/슬세권 (20점)</span><span id="scoreConvText">18점</span></div>
            <div class="progress-bg"><div class="progress-fill" id="barConv" style="width: 90%;"></div></div>
          </div>
          <div class="score-item">
            <div class="score-item-header"><span>🌳 환경/의료 (20점)</span><span id="scoreEnvText">18점</span></div>
            <div class="progress-bg"><div class="progress-fill" id="barEnv" style="width: 90%;"></div></div>
          </div>
          <div class="score-item">
            <div class="score-item-header"><span style="color: var(--han-river);">🌊 한강 보너스 (10점)</span><span id="scoreRiverText" style="color: var(--han-river);">+0점</span></div>
            <div class="progress-bg"><div class="progress-fill river-fill" id="barRiver" style="width: 0%;"></div></div>
          </div>
        </div>
      </div>

      <!-- 2. 💰 실거래가 탭 (클릭 시 노출) -->
      <div class="tab-content" id="priceTab" style="display: none;">
        <div id="realEstatePriceContainer">
          <div class="info-message-box">📍 지도를 클릭하시면 해당 지역의 최근 아파트 실거래가를 불러옵니다.</div>
        </div>
      </div>

      <!-- 3. 📍 주변 시설 탭 (클릭 시 노출) -->
      <div class="tab-content" id="listTab" style="display: none;">
        <div id="placesList"></div>
      </div>
    </div>

    <button class="my-location-fab" onclick="moveToUserLocation()">📍 내 위치 주변 분석</button>
  </div>

  <script>
    // 🔑 공공데이터포털 서비스키 (Decoding 키 권장)
    const PUBLIC_DATA_SERVICE_KEY = '92c137cd088bdd952ac092dbc9e9148be3a60b74db44880d0f78a76cde5f4d0b';

    let map = null, geocoder = null, placesService = null;
    let centerMarker = null, circle5Min = null, circle10Min = null;
    let currentMarkers = [], activeOverlay = null;
    let activeCategories = ['SW8', 'SC4', 'MT1', 'HP8'];
    let lastScanData = [];

    const DEFAULT_LAT = 37.521569, DEFAULT_LNG = 126.924311, DEFAULT_ZOOM = 5;

    kakao.maps.load(function () {
      initMap();
      getUserGeolocation();
    });

    function initMap() {
      const container = document.getElementById('map');
      map = new kakao.maps.Map(container, { center: new kakao.maps.LatLng(DEFAULT_LAT, DEFAULT_LNG), level: DEFAULT_ZOOM });
      geocoder = new kakao.maps.services.Geocoder();
      placesService = new kakao.maps.services.Places();

      kakao.maps.event.addListener(map, 'click', function (mouseEvent) {
        analyzeLocation(mouseEvent.latLng);
      });

      analyzeLocation(new kakao.maps.LatLng(DEFAULT_LAT, DEFAULT_LNG));
    }

    function getUserGeolocation() {
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(
          (pos) => {
            const loc = new kakao.maps.LatLng(pos.coords.latitude, pos.coords.longitude);
            map.setCenter(loc);
            analyzeLocation(loc);
            document.getElementById('keywordInput').value = '내 위치 주변';
          },
          () => console.log('위치 권한 미허용')
        );
      }
    }

    function moveToUserLocation() { getUserGeolocation(); }

    function analyzeLocation(latLng) {
      map.panTo(latLng);
      drawBuffers(latLng);

      geocoder.coord2RegionCode(latLng.getLng(), latLng.getLat(), (result, status) => {
        if (status === kakao.maps.services.Status.OK) {
          for (let i = 0; i < result.length; i++) {
            if (result[i].region_type === 'B') {
              document.getElementById('currentAddressText').innerText = result[i].address_name;
              const lawdCd = result[i].code.substring(0, 5);
              fetchRealEstateTransactions(lawdCd);
              break;
            }
          }
        }
      });

      fetchSurroundingData(latLng).then((data) => {
        lastScanData = data;
        const scoreResult = calculateStrictScore(data);
        renderReport(scoreResult);
        renderPlaceList(data);
        renderCategoryMarkers(data);
      });
    }

    async function fetchRealEstateTransactions(lawdCd) {
      const container = document.getElementById('realEstatePriceContainer');

      if (!PUBLIC_DATA_SERVICE_KEY || PUBLIC_DATA_SERVICE_KEY.includes('여기에')) {
        container.innerHTML = `
          <div class="info-message-box">
            🔑 <strong>공공데이터 인증키 필요</strong><br><br>
            JS 상단 <code>PUBLIC_DATA_SERVICE_KEY</code> 변수에 발급받으신 서비스키(Decoding 키)를 입력해 주세요.
          </div>
        `;
        return;
      }

      container.innerHTML = `<div class="info-message-box">🔄 아파트 실거래가 정보를 가져오는 중...</div>`;

      let cleanKey = PUBLIC_DATA_SERVICE_KEY.trim();
      try { if (cleanKey.includes('%')) cleanKey = decodeURIComponent(cleanKey); } catch(e) {}

      const dealYmd = '202405';
      const encodedKey = encodeURIComponent(cleanKey);
      const targetUrl = `https://apis.data.go.kr/1613000/RTMSDataSvcAptTrade/getRTMSDataSvcAptTrade?serviceKey=${encodedKey}&LAWD_CD=${lawdCd}&DEAL_YMD=${dealYmd}`;
      const proxyUrl = `https://api.allorigins.win/raw?url=${encodeURIComponent(targetUrl)}`;

      try {
        const response = await fetch(proxyUrl);
        const xmlText = await response.text();

        const parser = new DOMParser();
        const xmlDoc = parser.parseFromString(xmlText, "text/xml");
        const items = xmlDoc.getElementsByTagName("item");

        if (items.length === 0) {
          container.innerHTML = `<div class="info-message-box">📭 최근 거래 신고 내역이 없습니다.</div>`;
          return;
        }

        container.innerHTML = '';
        for (let i = 0; i < Math.min(items.length, 15); i++) {
          const item = items[i];
          const aptName = getXmlValue(item, '아파트') || getXmlValue(item, '단지명') || '아파트';
          const price = getXmlValue(item, '거래금액')?.trim() || '0';
          const area = getXmlValue(item, '전용면적') || '0';
          const floor = getXmlValue(item, '층') || '-';
          const day = getXmlValue(item, '일') || '-';
          const month = getXmlValue(item, '월') || '-';
          const pyung = Math.round(parseFloat(area) / 3.3);

          const card = document.createElement('div');
          card.className = 'trade-card';
          card.innerHTML = `
            <div class="apt-header">
              <span class="apt-name">${aptName}</span>
              <span class="price-tag">${price} 만원</span>
            </div>
            <div class="trade-details">
              <span>📐 ${Math.round(parseFloat(area))}㎡ (${pyung}평)</span>
              <span>🏢 ${floor}층</span>
              <span>📅 ${month}월 ${day}일</span>
            </div>
          `;
          container.appendChild(card);
        }
      } catch (err) {
        container.innerHTML = `<div class="info-message-box" style="color:#e11d48;">❌ 실거래가 조회 오류 발생</div>`;
      }
    }

    function getXmlValue(parent, tagName) {
      const el = parent.getElementsByTagName(tagName)[0];
      return el ? el.textContent : null;
    }

    function drawBuffers(center) {
      if (centerMarker) centerMarker.setMap(null);
      if (circle5Min) circle5Min.setMap(null);
      if (circle10Min) circle10Min.setMap(null);

      centerMarker = new kakao.maps.Marker({ position: center, map: map });
      circle5Min = new kakao.maps.Circle({ center: center, radius: 400, strokeWeight: 2, strokeColor: '#3182F6', strokeOpacity: 0.8, fillColor: '#3182F6', fillOpacity: 0.1, map: map });
      circle10Min = new kakao.maps.Circle({ center: center, radius: 800, strokeWeight: 1.5, strokeColor: '#6B7280', strokeOpacity: 0.7, strokeStyle: 'dash', fillColor: '#6B7280', fillOpacity: 0.04, map: map });
    }

    function fetchSurroundingData(center) {
      const categories = [
        { type: 'cat', code: 'SW8' }, { type: 'cat', code: 'SC4' }, { type: 'cat', code: 'AC5' },
        { type: 'cat', code: 'MT1' }, { type: 'cat', code: 'CS2' }, { type: 'cat', code: 'HP8' },
        { type: 'kw', code: 'RIVER', kw: '한강공원' }
      ];

      const promises = categories.map((cat) => {
        return new Promise((resolve) => {
          if (cat.type === 'kw') {
            placesService.keywordSearch(cat.kw, (data, status) => {
              resolve({ category: cat.code, items: status === kakao.maps.services.Status.OK ? data : [] });
            }, { location: center, radius: 800 });
          } else {
            placesService.categorySearch(cat.code, (data, status) => {
              resolve({ category: cat.code, items: status === kakao.maps.services.Status.OK ? data : [] });
            }, { location: center, radius: 800 });
          }
        });
      });
      return Promise.all(promises);
    }

    function calculateStrictScore(dataMap) {
      let trafficScore = 10, eduScore = 10, convScore = 8, envScore = 8, riverBonus = 0;
      let closestSubway = null, closestSchool = null, riverStatus = null;

      dataMap.forEach(group => {
        if (group.category === 'SW8' && group.items.length > 0) {
          closestSubway = group.items[0];
          const dist = parseInt(closestSubway.distance);
          if (dist <= 400) trafficScore = 25 + Math.min((group.items.length - 1) * 2.5, 5);
          else if (dist <= 800) trafficScore = 18 + Math.min((group.items.length - 1) * 2, 4);
        }
        if (group.category === 'SC4' && group.items.length > 0) {
          closestSchool = group.items[0];
          const dist = parseInt(closestSchool.distance);
          if (dist <= 400) eduScore += 18; else if (dist <= 800) eduScore += 12;
        }
        if (group.category === 'AC5' && group.items.length >= 3) eduScore += 8;
        if (group.category === 'MT1' || group.category === 'CS2') { if (group.items.length >= 2) convScore += 4; }
        if (group.category === 'HP8' && group.items.length > 0) envScore += 6;

        if (group.category === 'RIVER' && group.items.length > 0) {
          const minDist = parseInt(group.items[0].distance);
          if (minDist <= 400) { riverBonus = 10; riverStatus = 'CHON'; }
          else if (minDist <= 800) { riverBonus = 5; riverStatus = 'INJEOP'; }
        }
      });

      trafficScore = Math.min(Math.round(trafficScore), 30);
      eduScore = Math.min(Math.round(eduScore), 30);
      convScore = Math.min(Math.round(convScore), 20);
      envScore = Math.min(Math.round(envScore), 20);

      const totalScore = Math.min(trafficScore + eduScore + convScore + envScore + riverBonus, 100);
      let grade = 'C', gradeClass = 'grade-C';
      if (totalScore >= 88) { grade = 'S+ 등급'; gradeClass = 'grade-S-plus'; }
      else if (totalScore >= 78) { grade = 'S 등급'; gradeClass = 'grade-S'; }
      else if (totalScore >= 66) { grade = 'A 등급'; gradeClass = 'grade-A'; }
      else if (totalScore >= 52) { grade = 'B 등급'; gradeClass = 'grade-B'; }

      return { totalScore, grade, gradeClass, trafficScore, eduScore, convScore, envScore, riverBonus, riverStatus, closestSubway, closestSchool };
    }

    function renderReport(res) {
      document.getElementById('totalScoreText').innerHTML = `${res.totalScore}<span>/100</span>`;
      const badge = document.getElementById('gradeBadgeText');
      badge.innerText = res.grade; badge.className = `grade-badge ${res.gradeClass}`;

      const hanBadge = document.getElementById('hanRiverBadge');
      const hanBadgeText = document.getElementById('hanRiverBadgeText');
      if (res.riverStatus === 'CHON') { hanBadge.style.display = 'flex'; hanBadgeText.innerText = '🌊 초한강권 / 한강뷰 (+10점)'; }
      else if (res.riverStatus === 'INJEOP') { hanBadge.style.display = 'flex'; hanBadgeText.innerText = '🌊 한강 인접 (+5점)'; }
      else { hanBadge.style.display = 'none'; }

      if (res.closestSubway) {
        const d = parseInt(res.closestSubway.distance);
        document.getElementById('subwayNameText').innerText = res.closestSubway.place_name;
        document.getElementById('subwayWalkText').innerText = `${d}m · 도보 ${Math.ceil(d / 80)}분`;
      } else { document.getElementById('subwayNameText').innerText = '800m 내 없음'; document.getElementById('subwayWalkText').innerText = '-'; }

      if (res.closestSchool) {
        const d = parseInt(res.closestSchool.distance);
        document.getElementById('schoolNameText').innerText = res.closestSchool.place_name;
        document.getElementById('schoolWalkText').innerText = `${d}m · 도보 ${Math.ceil(d / 80)}분`;
      } else { document.getElementById('schoolNameText').innerText = '800m 내 없음'; document.getElementById('schoolWalkText').innerText = '-'; }

      document.getElementById('scoreTrafficText').innerText = `${res.trafficScore}점`;
      document.getElementById('barTraffic').style.width = `${(res.trafficScore / 30) * 100}%`;
      document.getElementById('scoreEduText').innerText = `${res.eduScore}점`;
      document.getElementById('barEdu').style.width = `${(res.eduScore / 30) * 100}%`;
      document.getElementById('scoreConvText').innerText = `${res.convScore}점`;
      document.getElementById('barConv').style.width = `${(res.convScore / 20) * 100}%`;
      document.getElementById('scoreEnvText').innerText = `${res.envScore}점`;
      document.getElementById('barEnv').style.width = `${(res.envScore / 20) * 100}%`;
      document.getElementById('scoreRiverText').innerText = `+${res.riverBonus}점`;
      document.getElementById('barRiver').style.width = `${(res.riverBonus / 10) * 100}%`;
    }

    function renderPlaceList(dataMap) {
      const listContainer = document.getElementById('placesList');
      listContainer.innerHTML = '';
      let allPlaces = [];
      dataMap.forEach(group => { allPlaces = allPlaces.concat(group.items); });
      allPlaces.sort((a, b) => parseInt(a.distance) - parseInt(b.distance));

      allPlaces.forEach(place => {
        const card = document.createElement('div');
        card.className = 'place-card';
        card.innerHTML = `<span class="badge">${place.category_group_name || '시설'}</span><div class="title">${place.place_name}</div><div class="address">${place.road_address_name || place.address_name} (${place.distance}m)</div>`;
        card.onclick = () => { const pos = new kakao.maps.LatLng(place.y, place.x); map.panTo(pos); showOverlay(place, pos); };
        listContainer.appendChild(card);
      });
    }

    function renderCategoryMarkers(dataMap) {
      clearMarkers();
      dataMap.forEach(group => {
        if (activeCategories.includes(group.category)) {
          group.items.forEach(place => {
            const pos = new kakao.maps.LatLng(place.y, place.x);
            const marker = new kakao.maps.Marker({ position: pos, map: map });
            marker.addListener('click', () => { showOverlay(place, pos); });
            currentMarkers.push(marker);
          });
        }
      });
    }

    function clearMarkers() { currentMarkers.forEach(m => m.setMap(null)); currentMarkers = []; }

    function showOverlay(place, pos) {
      if (activeOverlay) activeOverlay.setMap(null);
      const content = document.createElement('div');
      content.className = 'custom-overlay-card';
      content.innerHTML = `<strong>${place.place_name}</strong><div class="addr">${place.road_address_name || place.address_name}</div><a href="${place.place_url}" target="_blank" class="link-btn">상세보기 ➔</a>`;
      activeOverlay = new kakao.maps.CustomOverlay({ content: content, map: map, position: pos, yAnchor: 1 });
    }

    function toggleLayer(code, btn) {
      if (activeCategories.includes(code)) { activeCategories = activeCategories.filter(c => c !== code); btn.classList.remove('active'); }
      else { activeCategories.push(code); btn.classList.add('active'); }
      renderCategoryMarkers(lastScanData);
    }

    function handleSearch(e) {
      e.preventDefault();
      const kw = document.getElementById('keywordInput').value.trim();
      if (!kw) return;
      placesService.keywordSearch(kw, (data, status) => {
        if (status === kakao.maps.services.Status.OK) { analyzeLocation(new kakao.maps.LatLng(data[0].y, data[0].x)); }
      });
    }

    // 📌 탭 전환 핵심 자바스크립트 함수
    function switchTab(tabName) {
      const reportTab = document.getElementById('reportTab');
      const priceTab = document.getElementById('priceTab');
      const listTab = document.getElementById('listTab');

      const reportBtn = document.getElementById('tabReportBtn');
      const priceBtn = document.getElementById('tabPriceBtn');
      const listBtn = document.getElementById('tabListBtn');

      // 전체 가림 처리
      reportTab.style.display = 'none'; 
      priceTab.style.display = 'none'; 
      listTab.style.display = 'none';

      reportBtn.classList.remove('active'); 
      priceBtn.classList.remove('active'); 
      listBtn.classList.remove('active');

      // 선택한 탭 보이기 처리
      if (tabName === 'report') { 
        reportTab.style.display = 'block'; 
        reportBtn.classList.add('active'); 
      } else if (tabName === 'price') { 
        priceTab.style.display = 'block'; 
        priceBtn.classList.add('active'); 
      } else if (tabName === 'list') { 
        listTab.style.display = 'block'; 
        listBtn.classList.add('active'); 
      }
    }
  </script>
</body>
